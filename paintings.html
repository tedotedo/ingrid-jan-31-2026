<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Paintings gallery - acrylic paintings on canvas">
  <title>paintings — ingrid aszkenasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <a href="index.html">ingrid aszkenasy</a>
      </div>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav-menu">
        <a href="paintings.html" class="active">paintings</a>
        <a href="drawings.html">drawings</a>
        <a href="about.html">about</a>
        <a href="contact.html">contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="gallery-header">
        <h1>paintings</h1>
      </div>

      <div class="gallery-grid">
        <!-- Artwork 1 -->
        <div class="gallery-item" data-src="images/paintings/deux-chevaux.png" data-title="Deux Chevaux" data-details="acrylic on canvas">
          <img src="images/paintings/deux-chevaux.png" alt="Deux Chevaux - acrylic on canvas">
          <div class="gallery-item-info">
            <p class="gallery-item-title">Deux Chevaux</p>
            <p class="gallery-item-details">acrylic on canvas</p>
          </div>
        </div>

        <!-- Artwork 2 -->
        <div class="gallery-item" data-src="images/paintings/living-with-the-past.png" data-title="Living With the Past" data-details="acrylic on canvas">
          <img src="images/paintings/living-with-the-past.png" alt="Living With the Past - acrylic on canvas">
          <div class="gallery-item-info">
            <p class="gallery-item-title">Living With the Past</p>
            <p class="gallery-item-details">acrylic on canvas</p>
          </div>
        </div>

        <!-- Artwork 3 -->
        <div class="gallery-item" data-src="images/paintings/paradise.png" data-title="Paradise" data-details="acrylic on canvas">
          <img src="images/paintings/paradise.png" alt="Paradise - acrylic on canvas">
          <div class="gallery-item-info">
            <p class="gallery-item-title">Paradise</p>
            <p class="gallery-item-details">acrylic on canvas</p>
          </div>
        </div>

        <!-- Artwork 4 -->
        <div class="gallery-item" data-src="images/paintings/turn-left.png" data-title="Turn Left" data-details="acrylic on canvas">
          <img src="images/paintings/turn-left.png" alt="Turn Left - acrylic on canvas">
          <div class="gallery-item-info">
            <p class="gallery-item-title">Turn Left</p>
            <p class="gallery-item-details">acrylic on canvas</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Lightbox for viewing full-size images -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <div class="lightbox-content">
      <img src="" alt="" id="lightbox-img">
      <div class="lightbox-info">
        <p class="gallery-item-title" id="lightbox-title"></p>
        <p class="gallery-item-details" id="lightbox-details"></p>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <p>&copy; 2026 Ingrid Aszkenasy. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
